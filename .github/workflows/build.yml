name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/example/waautoreply
          mv *.kt app/src/main/java/com/example/waautoreply/
          mv AndroidManifest.xml app/src/main/
          mv app.gradle.kts app/build.gradle.kts
      - run: gradle assembleDebug --no-daemon -Pvc=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release for in-app updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk wa-ai-reply.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest wa-ai-reply.apk --target ${{ github.sha }} --title "Build ${{ github.run_number }}" --notes "versionCode=${{ github.run_number }}"
